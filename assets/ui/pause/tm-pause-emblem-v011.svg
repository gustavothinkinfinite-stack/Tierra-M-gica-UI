<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Emblema arcano de Tierra Mágica</title>
  <desc id="desc">Astrolabio de latón y energía azul, símbolo provisional vectorial para la interfaz de pausa.</desc>
  <defs>
    <radialGradient id="orb" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#f5fbff"/>
      <stop offset=".18" stop-color="#83c6ff"/>
      <stop offset=".5" stop-color="#2c78c7"/>
      <stop offset="1" stop-color="#0b1b37"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c994"/>
      <stop offset=".25" stop-color="#c89a73"/>
      <stop offset=".55" stop-color="#8f6848"/>
      <stop offset=".78" stop-color="#d8ad79"/>
      <stop offset="1" stop-color="#6e4d36"/>
    </linearGradient>
    <filter id="blueGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <circle cx="400" cy="400" r="250" fill="#111824" stroke="url(#gold)" stroke-width="18"/>
    <circle cx="400" cy="400" r="220" fill="none" stroke="#5d8bc6" stroke-width="5" opacity=".9" filter="url(#blueGlow)"/>
    <circle cx="400" cy="400" r="187" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <circle cx="400" cy="400" r="150" fill="none" stroke="#2f435c" stroke-width="28" opacity=".9"/>
    <circle cx="400" cy="400" r="150" fill="none" stroke="url(#gold)" stroke-width="8"/>

    <g fill="none" stroke="#83c6ff" stroke-width="3" opacity=".78">
      <circle cx="400" cy="400" r="204" stroke-dasharray="4 14"/>
      <circle cx="400" cy="400" r="168" stroke-dasharray="2 20"/>
    </g>

    <g fill="url(#gold)" stroke="#5b3e2c" stroke-width="4">
      <path d="M400 38 L440 172 L419 250 L400 286 L381 250 L360 172 Z"/>
      <path d="M762 400 L628 440 L550 419 L514 400 L550 381 L628 360 Z"/>
      <path d="M400 762 L360 628 L381 550 L400 514 L419 550 L440 628 Z"/>
      <path d="M38 400 L172 360 L250 381 L286 400 L250 419 L172 440 Z"/>
    </g>

    <g fill="#0b1b37" stroke="url(#gold)" stroke-width="10">
      <circle cx="220" cy="220" r="25"/><circle cx="580" cy="220" r="25"/>
      <circle cx="580" cy="580" r="25"/><circle cx="220" cy="580" r="25"/>
    </g>
    <g fill="#5d8bc6" stroke="#c89a73" stroke-width="5" filter="url(#blueGlow)">
      <circle cx="220" cy="220" r="13"/><circle cx="580" cy="220" r="13"/>
      <circle cx="580" cy="580" r="13"/><circle cx="220" cy="580" r="13"/>
    </g>

    <g transform="translate(400 400)">
      <circle r="105" fill="#0e1014" stroke="url(#gold)" stroke-width="16"/>
      <circle r="77" fill="url(#orb)" stroke="#83c6ff" stroke-width="5" filter="url(#blueGlow)"/>
      <g stroke="#dff5ff" stroke-width="4" opacity=".9">
        <line x1="-50" y1="0" x2="50" y2="0"/>
        <line x1="0" y1="-50" x2="0" y2="50"/>
        <line x1="-35" y1="-35" x2="35" y2="35"/>
        <line x1="35" y1="-35" x2="-35" y2="35"/>
      </g>
      <circle r="11" fill="#fff"/>
    </g>

    <g fill="#c89a73" opacity=".9">
      <circle cx="400" cy="180" r="7"/><circle cx="555" cy="245" r="7"/>
      <circle cx="620" cy="400" r="7"/><circle cx="555" cy="555" r="7"/>
      <circle cx="400" cy="620" r="7"/><circle cx="245" cy="555" r="7"/>
      <circle cx="180" cy="400" r="7"/><circle cx="245" cy="245" r="7"/>
    </g>
  </g>
</svg>